version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3080:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - node_modules_cache:/app/node_modules
    command: npx next dev -p 3000 -H 0.0.0.0
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=aws-1-us-east-1.pooler.supabase.com
      - DB_PORT=5432
      - DB_USER=postgres.dfikabshrqezrolrknxk
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=postgres
      - DB_SSLMODE=require
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3080}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3080}
      - UMAMI_URL=http://umami:3000
    restart: unless-stopped

  umami-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=umami
      - POSTGRES_DB=umami
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      - DATABASE_URL=postgresql://umami:umami@umami-db:5432/umami
      - APP_SECRET=local-dev-secret-change-me
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      - umami-db
    restart: unless-stopped

volumes:
  node_modules_cache:
  umami_db_data:
